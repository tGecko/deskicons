name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Patch Rust version metadata
        shell: pwsh
        run: |
          $v = $env:VERSION
          (Get-Content Cargo.toml -Raw) `
            -replace '(?m)^version = "[^"]*"', "version = `"$v`"" |
            Set-Content Cargo.toml -NoNewline

          (Get-Content src/main.rs -Raw) `
            -replace '(const APP_VERSION: &str = )"[^"]*"', "`$1`"$v`"" |
            Set-Content src/main.rs -NoNewline

          $fileVersion = (($v -split '\.') + @('0', '0', '0', '0'))[0..3] -join ','
          (Get-Content deskicons.rc -Raw) `
            -replace 'FILEVERSION [0-9,]+', "FILEVERSION $fileVersion" `
            -replace 'PRODUCTVERSION [0-9,]+', "PRODUCTVERSION $fileVersion" `
            -replace 'VALUE "FileVersion", "[^"]*"', "VALUE `"FileVersion`", `"$v`"" `
            -replace 'VALUE "ProductVersion", "[^"]*"', "VALUE `"ProductVersion`", `"$v`"" |
            Set-Content deskicons.rc -NoNewline

          $manifestVersion = (($v -split '\.') + @('0', '0', '0', '0'))[0..3] -join '.'
          (Get-Content app.manifest -Raw) `
            -replace 'assemblyIdentity version="[^"]*"', "assemblyIdentity version=`"$manifestVersion`"" |
            Set-Content app.manifest -NoNewline

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: Assert Rust version
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Build
        run: cargo build --release

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Test
        run: cargo test

      - name: Package
        shell: pwsh
        run: |
          $stage = "dist/DeskIcons-$env:VERSION-win64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/deskicons.exe "$stage/deskicons.exe"
          Copy-Item README.dist.md "$stage/README.md"
          Copy-Item README_de.dist.md "$stage/README_de.md"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/DeskIcons-$env:VERSION-win64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeskIcons-${{ env.VERSION }}-win64.zip
          generate_release_notes: true
